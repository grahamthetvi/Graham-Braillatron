name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y \
          g++ make linux-libc-dev libsqlite3-dev liblouis-dev

      - name: Build and run self-tests
        run: make check

      - name: Run liblouis self-test
        run: make check-liblouis

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh -s -- -b "$HOME/local/bin" 1.2.0
          echo "$HOME/local/bin" >> "$GITHUB_PATH"

      - name: Install AVR core
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr

      - name: Compile firmware
        run: arduino-cli compile --fqbn arduino:avr:micro mobile-braille-embosser/firmware-arduino
