# Graham Braillatron — Klipper printer.cfg for MKS Monster8 V2 (Option A)
#
# Install: copy to ~/printer_data/config/printer.cfg on the Pi (or symlink).
# Flash Monster8 with Klipper firmware, then set [mcu] serial to your USB ID:
#   ls /dev/serial/by-id/usb-Klipper_*
#
# Driver slot map (Skeleton V5.1) — 8 real motors; there is no Z motor:
#   0=X (17HS08-1004S), 1=Y (17HS15-1504S), 2-7=NEMA14 emboss dots 1-6
# Cartesian [stepper_z] below is a dummy on unused EXP1 pins — not a driver
# slot. Do not attach a motor to EXP1. Pi-native UART4/UART9 TMC daisy
# chain is RETIRED — all drivers on Monster8.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_<your-id>

[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 500
# max_z_* exist only because cartesian kinematics require them.
# There is no physical Z motor; dummy [stepper_z] never travels.
max_z_velocity: 5
max_z_accel: 100

# Required for SET_KINEMATIC_POSITION (startup homing shim below).
[force_move]
enable_force_move: True

# The Braillatron has no X home sensor (PA14 is the paper-edge sensor) and no
# physical Z axis. Dummy [stepper_z] exists only to satisfy cartesian
# kinematics — do not attach a motor. SET_KINEMATIC_POSITION marks X/Y/Z
# homed at 0 so G1 X/Y moves are accepted; braillatron-sentinel still
# issues a real G28 Y at boot. Dummy Z is never homed and never travels.
[delayed_gcode braillatron_startup]
initial_duration: 1.0
gcode:
  SET_KINEMATIC_POSITION X=0 Y=0 Z=0

#####################################################################
# Carriage X — Monster8 slot 0 (Driver X)
#####################################################################

[stepper_x]
step_pin: PC14
dir_pin: PC13
enable_pin: !PC15
microsteps: 16
# Assumed X carriage drive (not CAD-verified on this machine): GT2 2 mm-pitch
# belt, 20-tooth pulley → 40 mm travel per motor revolution. Klipper
# rotation_distance is millimetres per rev. Marburg Medium cell pitch (6.0 mm)
# and Row B stagger (2.5 mm) commanded as G1 X millimetres are physically
# correct only if this GT2/20T pulley/belt is fitted. No CAD PN is claimed.
rotation_distance: 40
# PA14 (X-STOP header) carries the TCRT5000 paper-edge sensor. It is read via
# QUERY_ENDSTOPS only — X is never homed with G28 (no X home sensor exists).
endstop_pin: ^PA14
position_endstop: 0
position_min: 0
position_max: 200
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PE6
run_current: 0.85
hold_current: 0.40
stealthchop_threshold: 999999

#####################################################################
# Paper feed Y — Monster8 slot 1 (Driver Y)
#####################################################################

[stepper_y]
step_pin: PE5
dir_pin: !PE4
enable_pin: !PC15
microsteps: 16
# Tractor feed kinematics proof (src/kinematics/motion_constants.h):
# 127 mm pitch circumference / 6.35 reduction = 20 mm travel per motor rev,
# 0.1 mm per full step, 1600 microsteps per 10 mm line at 16x.
rotation_distance: 20
endstop_pin: ^PA15
position_endstop: 0
position_min: 0
position_max: 500
homing_speed: 30

#####################################################################
# DUMMY Z — NOT A MOTOR. Cartesian kinematics require [stepper_z].
# The machine has X carriage + Y paper feed only. Do NOT attach a
# motor to these pins. EXP1 display-header pins (PB2 / PE10 / PE11)
# and unwired Z-STOP (PB13) are unused for motion.
#
# Do not confuse this with Monster8 driver slot 2 (silkscreen "Z"),
# which is a real TMC2209 for emboss_1. Dummy cartesian Z is not a
# driver slot and is never commanded as a travel axis.
#####################################################################

[stepper_z]
step_pin: PB2
dir_pin: PE10
enable_pin: !PE11
microsteps: 16
rotation_distance: 40
endstop_pin: ^PB13
position_endstop: 0
position_min: 0
position_max: 10

[tmc2209 stepper_y]
uart_pin: PE3
run_current: 1.20
hold_current: 0.60
stealthchop_threshold: 999999

#####################################################################
# Emboss dots 1–6 — Monster8 slots 2–7 (board silkscreen Z, E0–E4)
# Slot 2 (silkscreen Z) is emboss_1, NOT cartesian dummy [stepper_z].
# Row A: dots 1,3,5  |  Row B: dots 2,4,6
#####################################################################

[manual_stepper emboss_1]
step_pin: PE1
dir_pin: PE0
enable_pin: !PE2
microsteps: 16
rotation_distance: 40
velocity: 20
accel: 200

[tmc2209 manual_stepper emboss_1]
uart_pin: PB7
run_current: 0.80
hold_current: 0.40
stealthchop_threshold: 999999

[manual_stepper emboss_2]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB6
microsteps: 16
rotation_distance: 40
velocity: 20
accel: 200

[tmc2209 manual_stepper emboss_2]
uart_pin: PB3
run_current: 0.80
hold_current: 0.40
stealthchop_threshold: 999999

[manual_stepper emboss_3]
step_pin: PD6
dir_pin: !PD5
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
velocity: 20
accel: 200

[tmc2209 manual_stepper emboss_3]
uart_pin: PD4
run_current: 0.80
hold_current: 0.40
stealthchop_threshold: 999999

[manual_stepper emboss_4]
step_pin: PD2
dir_pin: !PD1
enable_pin: !PD3
microsteps: 16
rotation_distance: 40
velocity: 20
accel: 200

[tmc2209 manual_stepper emboss_4]
uart_pin: PD0
run_current: 0.80
hold_current: 0.40
stealthchop_threshold: 999999

[manual_stepper emboss_5]
step_pin: PC7
dir_pin: PC6
enable_pin: !PC8
microsteps: 16
rotation_distance: 40
velocity: 20
accel: 200

[tmc2209 manual_stepper emboss_5]
uart_pin: PD15
run_current: 0.80
hold_current: 0.40
stealthchop_threshold: 999999

[manual_stepper emboss_6]
step_pin: PD13
dir_pin: !PD12
enable_pin: !PD14
microsteps: 16
rotation_distance: 40
velocity: 20
accel: 200

[tmc2209 manual_stepper emboss_6]
uart_pin: PD11
run_current: 0.80
hold_current: 0.40
stealthchop_threshold: 999999

#####################################################################
# Endstops — verify wiring on your Monster8 headers
#   y_home     → TCST2103 Y home (PA15 / Y-STOP)
#   paper_edge → TCRT5000 paper edge (PA14 / X-STOP)
#####################################################################

# Real emboss strike: push the dot stepper out STROKE mm and retract.
# STEPPER_BUZZ is a ~10 s diagnostic wiggle and is only used by Factory Test.
[gcode_macro EMBOSS_DOT]
description: Single emboss strike (DOT=1..6, STROKE mm, SPEED mm/s)
gcode:
  {% set dot = params.DOT|int %}
  {% set stroke = params.STROKE|default(2.0)|float %}
  {% set speed = params.SPEED|default(40.0)|float %}
  MANUAL_STEPPER STEPPER=emboss_{dot} ENABLE=1
  MANUAL_STEPPER STEPPER=emboss_{dot} SET_POSITION=0
  MANUAL_STEPPER STEPPER=emboss_{dot} MOVE={stroke} SPEED={speed}
  MANUAL_STEPPER STEPPER=emboss_{dot} MOVE=0 SPEED={speed}

[gcode_macro BRAILLATRON_HOME_Y]
description: Homing macro for braillatron-sentinel boot sequence
gcode:
  G28 Y
