# Graham Braillatron — Klipper printer.cfg for MKS Monster8 V2 (Option A)
#
# Install: copy to ~/printer_data/config/printer.cfg on the Pi (or symlink).
# Flash Monster8 with Klipper firmware, then set [mcu] serial to your USB ID:
#   ls /dev/serial/by-id/usb-Klipper_*
#
# Driver slot map (Skeleton V5.1):
#   0=X (17HS08-1004S), 1=Y (17HS15-1504S), 2-7=NEMA14 emboss dots 1-6
# Pi-native UART4/UART9 TMC daisy chain is RETIRED — all drivers on Monster8.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32f407xx_<your-id>

[printer]
kinematics: none
max_velocity: 500
max_accel: 500

#####################################################################
# Carriage X — Monster8 slot 0 (Driver X)
#####################################################################

[stepper_x]
step_pin: PC14
dir_pin: PC13
enable_pin: !PC15
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA14
position_min: 0
position_max: 200
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PE6
run_current: 0.85
hold_current: 0.40
stealthchop_threshold: 999999

#####################################################################
# Paper feed Y — Monster8 slot 1 (Driver Y)
#####################################################################

[stepper_y]
step_pin: PE5
dir_pin: !PE4
enable_pin: !PC15
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA15
position_min: 0
position_max: 500
homing_speed: 30

[tmc2209 stepper_y]
uart_pin: PE3
run_current: 1.20
hold_current: 0.60
stealthchop_threshold: 999999

#####################################################################
# Emboss dots 1–6 — Monster8 slots 2–7 (Z, E0–E4)
# Row A: dots 1,3,5  |  Row B: dots 2,4,6
#####################################################################

[manual_stepper emboss_1]
step_pin: PE1
dir_pin: PE0
enable_pin: !PE2
microsteps: 16
rotation_distance: 40
velocity: 20
accel: 200

[tmc2209 manual_stepper emboss_1]
uart_pin: PB7
run_current: 0.80
hold_current: 0.40
stealthchop_threshold: 999999

[manual_stepper emboss_2]
step_pin: PB5
dir_pin: !PB4
enable_pin: !PB6
microsteps: 16
rotation_distance: 40
velocity: 20
accel: 200

[tmc2209 manual_stepper emboss_2]
uart_pin: PB3
run_current: 0.80
hold_current: 0.40
stealthchop_threshold: 999999

[manual_stepper emboss_3]
step_pin: PD6
dir_pin: !PD5
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
velocity: 20
accel: 200

[tmc2209 manual_stepper emboss_3]
uart_pin: PD4
run_current: 0.80
hold_current: 0.40
stealthchop_threshold: 999999

[manual_stepper emboss_4]
step_pin: PD2
dir_pin: !PD1
enable_pin: !PD3
microsteps: 16
rotation_distance: 40
velocity: 20
accel: 200

[tmc2209 manual_stepper emboss_4]
uart_pin: PD0
run_current: 0.80
hold_current: 0.40
stealthchop_threshold: 999999

[manual_stepper emboss_5]
step_pin: PC7
dir_pin: PC6
enable_pin: !PC8
microsteps: 16
rotation_distance: 40
velocity: 20
accel: 200

[tmc2209 manual_stepper emboss_5]
uart_pin: PD15
run_current: 0.80
hold_current: 0.40
stealthchop_threshold: 999999

[manual_stepper emboss_6]
step_pin: PD13
dir_pin: !PD12
enable_pin: !PD14
microsteps: 16
rotation_distance: 40
velocity: 20
accel: 200

[tmc2209 manual_stepper emboss_6]
uart_pin: PD11
run_current: 0.80
hold_current: 0.40
stealthchop_threshold: 999999

#####################################################################
# Endstops — verify wiring on your Monster8 headers
#   y_home     → TCST2103 Y home (PA15 / Y-STOP)
#   paper_edge → TCRT5000 paper edge (PA14 / X-STOP)
#####################################################################

[gcode_macro EMBOSS_DOT]
description: Brief emboss pulse via STEPPER_BUZZ
gcode:
  STEPPER_BUZZ STEPPER={params.STEPPER} DURATION={params.DURATION|default(100)}

[gcode_macro BRAILLATRON_HOME_Y]
description: Homing macro for braillatron-sentinel boot sequence
gcode:
  G28 Y
