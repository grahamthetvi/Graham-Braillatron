# Braillatron default: Orange Pi 3.5 mm aux jack (card @CARD@).
# dmix lets mpv and speech-dispatcher share the same output.
# Switch output: sudo braillatron-audio-select aux|bluetooth|i2s
pcm.dmixer {
  type dmix
  ipc_key 1024
  slave {
    pcm "hw:@CARD@,0"
    rate 48000
    period_size 1024
    buffer_size 4096
  }
}

pcm.!default {
  type plug
  slave.pcm "dmixer"
}

ctl.!default {
  type hw
  card @CARD@
}
