# Remote display sidecar — persisted copy lives in /data/braillatron/settings/
enabled=false
listen_address=127.0.0.1
listen_port=8080
allow_lan=false
session_idle_minutes=30
pairing_code_hash=
frame_socket_path=/run/braillatron/display.sock
cmd_socket_path=/run/braillatron/display-cmd.sock
static_root=/usr/share/braillatron/remote-display
