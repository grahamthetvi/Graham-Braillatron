# Remote display sidecar — off by default; enable from Settings on the device.
enabled=false
frame_socket=/run/braillatron/display.sock
cmd_socket=/run/braillatron/display-cmd.sock
listen_address=127.0.0.1
listen_port=8080
allow_lan=false
session_idle_minutes=30
pairing_code_hash=
static_dir=/usr/share/braillatron/remote-display
