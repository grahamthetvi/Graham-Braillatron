# Gmail OAuth + API (device flow; no client secret on device)
enabled=true
credentials_dir=/data/braillatron/credentials/gmail
client_id_path=/data/braillatron/credentials/gmail/client_id
token_path=/data/braillatron/credentials/gmail/token.json
scopes=https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/gmail.modify
link_timeout_sec=300
inbox_limit=25
export_dir=/data/braillatron/documents/gmail
user_agent=Braillatron/1.0 (accessibility device)
