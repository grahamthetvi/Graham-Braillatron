# Gmail / school email
# auth_mode: auto (prefer IMAP if linked, else OAuth) | oauth | imap
enabled=true
auth_mode=auto
credentials_dir=/data/braillatron/credentials/gmail
client_id_path=/data/braillatron/credentials/gmail/client_id
token_path=/data/braillatron/credentials/gmail/token.json
scopes=https://www.googleapis.com/auth/gmail.readonly https://www.googleapis.com/auth/gmail.send https://www.googleapis.com/auth/gmail.modify
link_timeout_sec=300
inbox_limit=25
export_dir=/data/braillatron/documents/gmail
user_agent=Braillatron/1.0 (accessibility device)

# IMAP + app password (school accounts). Leave imap_host empty to infer from email domain.
# Credentials file (mode 0600): email=... and password=... (app password)
imap_host=
imap_port=993
imap_password_path=/data/braillatron/credentials/gmail/imap.ini
imap_incoming_name=imap.ini
# Optional SMTP for send when using IMAP (empty = send not available via IMAP path)
smtp_host=
smtp_port=587
