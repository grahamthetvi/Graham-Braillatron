[Service]
# Appliance mode: no login prompt on tty1 — wait for braillatron-ui, then clear the text console.
ExecStart=
ExecStart=-/usr/local/sbin/braillatron-tty1-launch.sh
Restart=always
RestartSec=3
StandardInput=tty
StandardOutput=tty
StandardError=journal
TTYPath=/dev/tty1
TTYReset=no
TTYVHangup=no
