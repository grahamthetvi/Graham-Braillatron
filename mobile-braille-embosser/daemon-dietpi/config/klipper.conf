# Klipper / Moonraker motion backend (Monster8 Option A)
enabled=true
moonraker_url=http://127.0.0.1:7125
# Must exceed the longest blocking g-code: STEPPER_BUZZ runs ~10 s.
request_timeout_sec=15

# Y feed: 10 mm per line at 1600 microsteps (kinematics.conf 16x)
y_feed_mm_per_line=10.0
y_feed_speed_mm_s=20.0
x_move_speed_mm_s=30.0

# Paper edge is Monster8 X-STOP ^PA14, queried as Moonraker rail "x"
# (printer.cfg stepper_x endstop). Not E0-STOP. Y home is Y-STOP ^PA15 / "y".

# Emboss strike: EMBOSS_DOT macro in klipper/printer.cfg drives
# manual_stepper emboss_1..emboss_6 (slots 2–7 on Monster8) out STROKE mm
# and back. STEPPER_BUZZ is reserved for Factory Test.
emboss_stroke_mm=2.0
emboss_speed_mm_s=40.0
