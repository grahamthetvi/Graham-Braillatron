# Klipper / Moonraker motion backend (Monster8 Option A)
enabled=true
moonraker_url=http://127.0.0.1:7125
request_timeout_sec=5

# Y feed: 10 mm per line at 1600 microsteps (kinematics.conf 16x)
y_feed_mm_per_line=10.0
y_feed_speed_mm_s=20.0
x_move_speed_mm_s=30.0

# STEPPER_BUZZ factory / emboss pulse duration (ms)
stepper_buzz_duration_ms=100

# Emboss dot Klipper manual_stepper names (slots 2–7 on Monster8)
emboss_stepper_1=emboss_1
emboss_stepper_2=emboss_2
emboss_stepper_3=emboss_3
emboss_stepper_4=emboss_4
emboss_stepper_5=emboss_5
emboss_stepper_6=emboss_6
