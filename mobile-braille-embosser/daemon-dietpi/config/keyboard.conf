# Keyboard daemon — serial link and optional USB keyboard bench input.
# Chord assembly (40 ms window) runs on the Arduino; see shared/protocol.md.
# Set evdev_enabled=true to emulate the built-in 13-key layout via USB keyboard.
hardware_config=hardware.conf
evdev_enabled=false
evdev_device=auto
evdev_map_config=evdev_map.conf
evdev_grab=true
