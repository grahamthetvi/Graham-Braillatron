# Bench / developer input — USB keyboard emulates the built-in 13-key layout.
# Copy over keyboard.conf or merge these settings when developing on a PC:
#   cp config/keyboard-bench.conf config/keyboard.conf
hardware_config=hardware.conf
evdev_enabled=true
evdev_device=auto
evdev_map_config=evdev_map.conf
# false keeps your desktop keyboard usable in other windows; true matches Pi behavior.
evdev_grab=true
