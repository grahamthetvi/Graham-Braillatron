# Physical matrix index (row*4+col, bits 0-15) -> logical key name
# Edit only this file on the Pi when switch positions change (no firmware reflash).
# Keep firmware-arduino/src/matrix_map.h in sync if you also remap on-device.
map_00=dot_1
map_01=dot_2
map_02=dot_3
map_03=dot_4
map_04=dot_5
map_05=dot_6
map_06=dpad_up
map_07=dpad_down
map_08=backspace
map_09=enter
map_10=shift_tts
map_11=speech
map_12=menu
map_13=unused
map_14=unused
map_15=unused
