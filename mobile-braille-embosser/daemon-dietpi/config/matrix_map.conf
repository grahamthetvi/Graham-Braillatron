# OBSOLETE leftover from the retired 4×4 key-matrix era.
# Skeleton V5.1 firmware already transmits logical BRAILLATRON_KEY_*
# bit positions, so this map is identity. The daemon still loads it
# (hardware.conf matrix_map_config → keyboard_service); do not delete
# until that load path is removed. Edit only if firmware-side wiring
# (firmware-arduino/src/pins.h BUTTON_KEY_BITS) diverges.
#
# Wire key_state bit (0-15) -> logical key name.
map_00=dot_1
map_01=dot_2
map_02=dot_3
map_03=dot_4
map_04=dot_5
map_05=dot_6
map_06=dpad_up
map_07=dpad_down
map_08=backspace
map_09=enter
map_10=shift_tts
map_11=speech
map_12=menu
map_13=unused
map_14=unused
map_15=unused
