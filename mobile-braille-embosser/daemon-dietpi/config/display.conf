# Visual display backend — ST7789 SPI panel + HDMI framebuffer
backend=auto

# ST7789 is wired to Orange Pi SPI3 (build guide §3.6). DietPi spi3-spidev
# exposes /dev/spidev3.0 (not spidev0.0).
spidev=/dev/spidev3.0
fbdev=/dev/fb0
width=240
height=240

# Header pins 22 (DC) and 26 (RES) are gpiochip4 lines 9 and 7 on Orange Pi 3B
# RK3566 (V5.1 §3.6). Override gpio_chip if gpioinfo enumerates GPIO4 elsewhere.
gpio_chip=gpiochip4
gpio_dc=9
gpio_rst=7
gpio_cs=-1

# Local HDMI monitor. Set false only for a TTS-only or remote-display bench.
hdmi_enabled=true
hdmi_font_scale=0
ncurses_enabled=true

remote_display_enabled=false
remote_display_socket=/run/braillatron/display.sock
remote_display_cmd_socket=/run/braillatron/display-cmd.sock
