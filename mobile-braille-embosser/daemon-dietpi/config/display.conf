# Visual display backend — SPI panel + SSH mirror (HDMI optional)
backend=auto

spidev=/dev/spidev0.0
fbdev=/dev/fb0
width=240
height=240

# Placeholder GPIO lines until HAT schematic is finalized (-1 = unconfigured)
gpio_dc=-1
gpio_rst=-1
gpio_cs=-1

# HDMI framebuffer is optional; mirror is the primary backup when HDMI is unavailable.
hdmi_enabled=false
hdmi_font_scale=0
ncurses_enabled=true

# SSH mirror: publishes full UI chrome to a snapshot file for braillatron-ui-watch.
mirror_enabled=true
mirror_snapshot=/run/braillatron/ui-chrome.snapshot
