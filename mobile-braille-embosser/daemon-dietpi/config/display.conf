# Visual display backend — ST7789 SPI panel + HDMI framebuffer
backend=auto

spidev=/dev/spidev0.0
fbdev=/dev/fb0
width=240
height=240

# Placeholder GPIO lines — Orange Pi 3B SPI3 ST7789 (verify with gpioinfo)
gpio_dc=9
gpio_rst=7
gpio_cs=-1

hdmi_enabled=false
hdmi_font_scale=0
ncurses_enabled=true

remote_display_enabled=false
remote_display_socket=/run/braillatron/display.sock
remote_display_cmd_socket=/run/braillatron/display-cmd.sock
