# Visual display backend — ST7789 SPI panel + optional HDMI + wireless remote mirror
backend=auto

spidev=/dev/spidev0.0
fbdev=/dev/fb0
width=240
height=240

# Placeholder GPIO lines until HAT schematic is finalized (-1 = unconfigured)
gpio_dc=-1
gpio_rst=-1
gpio_cs=-1

# HDMI framebuffer is opt-in; default bench/dev visibility uses remote display.
hdmi_enabled=false
hdmi_font_scale=0
ncurses_enabled=true

# UI publisher gate — pair in Settings after starting braillatron-displayd.
remote_display_enabled=false
remote_frame_socket=/run/braillatron/display.sock
remote_cmd_socket=/run/braillatron/display-cmd.sock
