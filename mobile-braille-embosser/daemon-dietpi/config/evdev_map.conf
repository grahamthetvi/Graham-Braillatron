# USB keyboard bench map: Linux KEY_* name -> logical Braillatron key name.
# Edit to suit your keyboard; names must match matrix_map.conf logical keys.
# Braille dots use Perkins-style home-row clusters: FDS = dots 1-3, JKL = dots 4-6.
KEY_F=dot_1
KEY_D=dot_2
KEY_S=dot_3
KEY_J=dot_4
KEY_K=dot_5
KEY_L=dot_6
KEY_UP=dpad_up
KEY_DOWN=dpad_down
KEY_BACKSPACE=backspace
KEY_ENTER=enter
KEY_GRAVE=menu
KEY_TAB=shift_tts
KEY_RIGHTMETA=speech
KEY_SPACE=text:space
