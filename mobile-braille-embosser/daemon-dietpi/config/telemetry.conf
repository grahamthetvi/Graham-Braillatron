# Telemetry sentinel — Orange Pi 3B (paths from config only)
i2c_bus=/dev/i2c-1
ltc2944_address=0x64
drv2605l_address=0x5A
battery_low_percent=20
battery_critical_percent=5
coordinate_ram_path=/var/lib/braillatron/ram/coords.json
homing_status_path=/run/braillatron/homing.status
sentry_dsn=
memfault_project_key=
build_version=braillatron-dev
poll_interval_ms=500

# 4S Li-ion voltage window for SOC fallback (mV)
battery_4s_min_mv=12000
battery_4s_max_mv=16800
# LTC2944 voltage LSB (datasheet Table 3): 70.8 V full scale / 65535 = 1.0803 mV
# per count. This is NOT Rsense. Missing/wrong scale (historically 58.6) makes
# the 20%/5% SOC policy meaningless; sentinel refuses shutdown unless this
# matches the datasheet value.
ltc2944_mv_per_lsb=1.0803

# Charge-counter SOC (optional; 0/0 disables coulomb mode). V5.1 mounts the
# LTC2944 high-side on P+/P- but does not document Rsense; do not enable these
# until the sense resistor is measured and a full charge/discharge cycle has
# captured full/empty counts. A zeroed charge register must not look like an
# empty pack.
battery_full_charge_counts=0
battery_empty_charge_counts=0

# Limit GPIO sysfs paths are unused on V5.1. Paper edge is Monster8 X-STOP
# ^PA14 and Y home is Y-STOP ^PA15, both via Moonraker/Klipper. Homing is
# G28 Y only; there is no Pi GPIO fallback (empty paths are a no-op, not Y=0).
# Leave both empty. Not E0-STOP.
gpio_paper_edge=
gpio_y_home=
limit_active_low=1

# Volatile RAM text layers and persistent .brf output
ram_text_layers=/var/lib/braillatron/ram/layer1,/var/lib/braillatron/ram/layer2
persistent_output_dir=/data/braillatron/documents

# DRV2605L LRA shutdown notification (library 6 effect index)
shutdown_waveform_effect=47

# Charging detection: LTC2944 pack voltage rise over consecutive polls.
# V5.1 does not wire an IP2368 charge-status GPIO to the Pi. The module's
# onboard charge LED is visual-only (factory eyeball), not a sysfs input.
# Leave ip2368_status_path empty; do not invent a pin.
charging_rise_mv=50
charging_polls_required=3
ip2368_status_path=
