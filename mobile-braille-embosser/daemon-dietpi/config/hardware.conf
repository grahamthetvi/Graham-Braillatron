# Hardware connections — Orange Pi 3B skeleton prototype V5.1 (Monster8 + Klipper Option A)
board_profile=skeleton_v5

# Arduino co-processor USB CDC link
arduino_device=/dev/ttyACM0
baud_rate=115200
allow_missing_arduino=false

# Motion via Klipper/Moonraker when Monster8 is wired and flashed
motion_enabled=true

# Paths relative to BRAILLATRON_CONFIG (or config/ when developing)
matrix_map_config=matrix_map.conf
telemetry_config=telemetry.conf
klipper_config=klipper.conf
evdev_grab=true
