# Hardware connections — Orange Pi 3B skeleton prototype (edit when wiring changes)
board_profile=skeleton_v4

# Arduino co-processor USB CDC link
arduino_device=/dev/ttyACM0
baud_rate=115200
allow_missing_arduino=true

# Motion drivers not wired on skeleton; set true when TMC2209 stack is ready
motion_enabled=false

# Paths relative to BRAILLATRON_CONFIG (or config/ when developing)
matrix_map_config=matrix_map.conf
telemetry_config=telemetry.conf
evdev_grab=true
